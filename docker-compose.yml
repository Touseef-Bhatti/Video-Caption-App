version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caption_user
      POSTGRES_PASSWORD: caption_pass
      POSTGRES_DB: caption_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caption_user -d caption_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://caption_user:caption_pass@postgres:5432/caption_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - temp_storage:/tmp/caption_app
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 --timeout 120"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://caption_user:caption_pass@postgres:5432/caption_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - temp_storage:/tmp/caption_app
    # Never load a full video into RAM: the worker reads/writes files on
    # disk at every step (see workers/tasks.py), so this container's only
    # scaling knob is concurrency, not memory headroom per job.
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://caption_user:caption_pass@postgres:5432/caption_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - temp_storage:/tmp/caption_app
    # Celery's own beat scheduler (not system cron -- the base image has
    # none) ticks workers.tasks.cleanup_expired_files on a timer defined
    # in workers/celery_app.py's beat_schedule (section 18/59): sweeps
    # stale processing temp files, abandoned upload chunk directories, and
    # marks orphaned upload_sessions rows as cancelled.
    command: celery -A workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
  temp_storage:
