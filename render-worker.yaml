# Dedicated caption-processing worker; shares the existing web service settings.
services:
  - type: worker
    name: video-caption-worker
    runtime: docker
    region: ohio
    plan: starter
    repo: https://github.com/Touseef-Bhatti/Video-Caption-App
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A workers.celery_app worker --beat --loglevel=info --concurrency=1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: DATABASE_URL
      - key: JWT_SECRET
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: JWT_SECRET
      - key: GEMINI_API_KEY
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: GEMINI_MODEL
      - key: CELERY_BROKER_URL
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: CELERY_BROKER_URL
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: CELERY_RESULT_BACKEND
      - key: STORAGE_BUCKET
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: STORAGE_BUCKET
      - key: STORAGE_ACCESS_KEY
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: STORAGE_ACCESS_KEY
      - key: STORAGE_SECRET_KEY
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: STORAGE_SECRET_KEY
      - key: STORAGE_REGION
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: STORAGE_REGION
      - key: STORAGE_ENDPOINT_URL
        fromService:
          name: Video-Caption-App
          type: web
          envVarKey: STORAGE_ENDPOINT_URL
      - key: ENVIRONMENT
        value: production
