name: caption_app
description: AI Video Captioning Application -- Flutter client (Android/iOS/Web).
publish_to: "none"
version: 1.0.0+1

environment:
  # PopScope.onPopInvokedWithResult and ThemeData(cardTheme: CardThemeData)
  # require Flutter 3.27+ (Dart 3.6+).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Secure JWT storage
  flutter_secure_storage: ^9.2.2

  # File / media
  file_picker: ^8.0.3
  video_player: ^2.9.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # Misc
  intl: ^0.19.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Caption Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 800
    - family: Caption Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
    - family: Caption Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
    - family: Caption Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: Caption Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
