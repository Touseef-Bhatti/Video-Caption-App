server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;

    location = /index.html {
        try_files /index.html =404;
    }

    # Never return the SPA HTML for a missing script or other static asset.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
