services:
  postgres:
    ports: !override
      - "15432:5432"

  redis:
    ports: !override
      - "16379:6379"

  backend:
    ports: !override
      - "9001:8000"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:9000,http://127.0.0.1:9000
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: http://localhost:9001
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    environment:
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
    volumes:
      - ./backend:/app

  render_worker:
    environment:
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
    volumes:
      - ./backend:/app

  beat:
    environment:
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
