services:
  postgres:
    ports: !override
      - "15432:5432"

  redis:
    ports: !override
      - "16379:6379"

  backend:
    ports: !override
      - "9001:8000"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:9000,http://127.0.0.1:9000
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
    volumes:
      - ./backend:/app

  worker:
    environment:
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
    volumes:
      - ./backend:/app

  render_worker:
    environment:
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
    volumes:
      - ./backend:/app

  beat:
    environment:
      JOB_BACKEND: celery
      CHUNK_STORAGE_BACKEND: local
